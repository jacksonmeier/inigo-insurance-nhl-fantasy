name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a deploy that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # The hosted Supabase project. Both values are public: they end up in the
      # browser bundle, and row-level security is what protects the data. The
      # key is the project's publishable key (Project Settings > API Keys).
      - name: Build
        env:
          VITE_SUPABASE_URL: https://rlxqdonkaznusyqgqlya.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_-dSibkISZDJUOa9H7LB3SA_OQQWh4Fk
        run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
